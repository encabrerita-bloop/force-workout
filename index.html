<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="FORCE"/>
<title>FORCE — Entrenamiento 3 días</title>
<style>
:root{--bg:#0A0E1A;--surface:#111827;--card:#1C2333;--border:#252D40;--accent:#FF6B35;--accent2:#FFB347;--green:#22C55E;--blue:#3D7BF5;--text:#F1F5FF;--muted:#6B7698;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',sans-serif;min-height:100vh;}
button{cursor:pointer;font-family:inherit;-webkit-appearance:none;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* HOME */
.hw{max-width:640px;margin:0 auto;width:100%;padding:0 18px;}
.topbar{padding:44px 0 4px;display:flex;align-items:flex-end;justify-content:space-between;}
.wm{font-size:36px;font-weight:900;letter-spacing:-2px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.tg{font-size:12px;color:var(--muted);padding-bottom:6px;}
.stats{display:flex;gap:10px;margin:18px 0 28px;}
.stat{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 12px;text-align:center;}
.sv{font-size:26px;font-weight:800;color:var(--accent);}
.sl{font-size:11px;color:var(--muted);margin-top:3px;}
.shd{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
.dlist{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}
.dcard{border-radius:16px;overflow:hidden;border:1px solid var(--border);background:var(--card);}
.dbtn{width:100%;background:none;border:none;padding:18px;display:flex;align-items:center;gap:14px;text-align:left;}
.dicon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex-shrink:0;border:2px solid;}
.dname{font-size:17px;font-weight:700;}
.dsub{font-size:13px;color:var(--muted);margin-top:2px;}
.dright{text-align:right;flex-shrink:0;}
.dlast{font-size:11px;color:var(--muted);}
.dcnt{font-size:13px;font-weight:600;margin-top:2px;}
.chv{font-size:18px;color:var(--muted);transition:transform .2s;display:inline-block;margin-left:8px;}
.chv.open{transform:rotate(180deg);}
.ppanel{background:var(--surface);border-top:1px solid var(--border);padding:16px 18px;display:none;}
.ppanel.open{display:block;}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);}
.prow:last-child{border-bottom:none;}
.pnum{width:22px;height:22px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--muted);flex-shrink:0;}
.pname{font-size:14px;font-weight:600;flex:1;}
.pmus{font-size:12px;color:var(--muted);}
.ptime{font-size:12px;color:var(--muted);margin-left:auto;flex-shrink:0;}
.sbtn{width:100%;padding:13px 0;border-radius:10px;border:none;font-weight:800;font-size:15px;color:#fff;margin-top:14px;}
.hsec{margin-bottom:40px;}
.hrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:7px;}
.hdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.hname{flex:1;font-size:14px;}
.hdate{font-size:12px;color:var(--muted);}
.ftip{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:40px;}

/* SESSION */
.shdr{padding:16px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg);}
.bbtn{background:none;border:none;font-size:22px;color:var(--muted);padding:0 8px 0 0;}
.smeta{flex:1;}
.srl{font-size:12px;color:var(--muted);}
.sdl{font-size:16px;font-weight:700;}
.pdots{display:flex;gap:5px;align-items:center;}
.pd{width:8px;height:8px;border-radius:50%;background:var(--border);transition:background .2s;}
.pd.pdn{background:var(--green);}
.pd.pac{background:var(--accent);}
.smain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 18px;gap:12px;}
.selbl{font-size:13px;color:var(--muted);text-align:center;}
.settl{font-size:21px;font-weight:800;text-align:center;line-height:1.2;}
.scue{font-size:13px;color:var(--muted);text-align:center;max-width:300px;line-height:1.5;}
.abtn{padding:14px 52px;border-radius:14px;border:none;font-size:17px;font-weight:800;}

/* Exercise cards */
.eclist{padding:0 18px 24px;display:flex;flex-direction:column;gap:8px;}
.ecard{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);transition:border-color .2s;}
.ecard.iac{border-color:var(--accent);}
.ecard.idn{border-color:var(--green);background:#0D1F14;}
.ecbtn{width:100%;display:flex;align-items:center;gap:10px;padding:13px 15px;background:none;border:none;text-align:left;}
.enum{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--border);color:var(--muted);flex-shrink:0;}
.enum.nac{background:var(--accent);color:#fff;}
.enum.ndn{background:var(--green);color:#fff;}
.ettl{font-size:14px;font-weight:700;}
.emus{font-size:12px;color:var(--muted);margin-top:1px;}
.etm{font-size:11px;color:var(--muted);flex-shrink:0;}
.echv{color:var(--muted);font-size:15px;transition:transform .2s;margin-left:4px;}
.ebody{padding:0 15px 15px;border-top:1px solid var(--border);display:none;}
.ebody.open{display:block;}

/* YouTube embed */
.yt-wrap{position:relative;width:100%;padding-top:56.25%;border-radius:10px;overflow:hidden;margin:12px 0 10px;background:#000;}
.yt-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none;}
.yt-tap{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);cursor:pointer;border-radius:10px;}
.yt-play{width:56px;height:56px;background:rgba(255,107,53,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;}
.yt-play svg{width:24px;height:24px;fill:#fff;margin-left:4px;}
.yt-title{position:absolute;bottom:10px;left:12px;right:12px;font-size:12px;color:rgba(255,255,255,.85);font-weight:600;}

.ecue{font-size:13px;color:#C8D0E8;line-height:1.6;margin-bottom:9px;}
.etip{background:var(--surface);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:9px 12px;font-size:12.5px;color:var(--accent2);line-height:1.5;}

/* DONE */
.donew{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:18px;text-align:center;}
.demi{font-size:72px;}
.dttl{font-size:30px;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.dsubt{font-size:15px;color:var(--muted);}
.dsts{display:flex;gap:16px;margin:8px 0;}
.dst{background:var(--surface);border-radius:12px;padding:14px 20px;text-align:center;}
.dstv{font-size:24px;font-weight:800;color:var(--accent);}
.dstl{font-size:11px;color:var(--muted);margin-top:3px;}
.dcta{padding:14px 40px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;font-size:16px;margin-top:8px;}
</style>
</head>
<body>

<!-- HOME -->
<div id="home-screen" class="screen active">
  <div class="hw">
    <div class="topbar">
      <div class="wm">FORCE</div>
      <div class="tg">3 días · 20 min · Casa</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="sv" id="sw">0</div><div class="sl">esta semana</div></div>
      <div class="stat"><div class="sv" id="st">0</div><div class="sl">sesiones</div></div>
      <div class="stat"><div class="sv" id="sm">0</div><div class="sl">minutos</div></div>
    </div>
    <div class="shd">Sesión de hoy</div>
    <div class="dlist" id="dlist"></div>
    <div id="hsec" style="display:none">
      <div class="shd">Historial</div>
      <div class="hsec" id="hlist"></div>
    </div>
    <div class="ftip">40s trabajo · 20s descanso · 3 rondas · ~20 min<br>Descansa al menos 1 día entre sesiones.</div>
  </div>
</div>

<!-- SESSION -->
<div id="sess-screen" class="screen">
  <div class="shdr">
    <button class="bbtn" onclick="goHome()">←</button>
    <div class="smeta">
      <div class="srl" id="sround">Ronda 1 de 3</div>
      <div class="sdl" id="stitle">Día A</div>
    </div>
    <div class="pdots" id="sdots"></div>
  </div>
  <div class="smain" id="smain">
    <div class="selbl" id="selbl"></div>
    <div class="settl" id="settl"></div>
    <div id="ringwrap"></div>
    <div class="scue" id="scue"></div>
    <button class="abtn" id="sabtn" onclick="toggleTimer()" style="background:var(--accent);color:#fff;">Iniciar</button>
  </div>
  <div class="eclist" id="scards"></div>
</div>

<!-- DONE -->
<div id="done-screen" class="screen">
  <div class="donew">
    <div class="demi">🔥</div>
    <div class="dttl">¡Sesión completa!</div>
    <div class="dsubt" id="dsub"></div>
    <div class="dsts">
      <div class="dst"><div class="dstv" id="dser">12</div><div class="dstl">series</div></div>
      <div class="dst"><div class="dstv">20</div><div class="dstl">minutos</div></div>
      <div class="dst"><div class="dstv" id="dkcal">~180</div><div class="dstl">kcal est.</div></div>
    </div>
    <button class="dcta" onclick="finishSession()">Terminar →</button>
  </div>
</div>

<script>
// ─── EXERCISE DATA ────────────────────────────────────────────────────────────
// ytId: YouTube video ID — uses nocookie embed, starts at best moment
const DAYS = [
  {
    id:"A",name:"Día A",label:"Empuje + Pierna",color:"#3D7BF5",bg:"rgba(61,123,245,.12)",kcal:180,
    exercises:[
      {id:"squat",name:"Squat con banda",muscles:"Piernas · Glúteos · Core",work:40,rest:20,
       ytId:"CKcDiJnLaLY",ytTitle:"Squat — Proper Form",
       cue:"Pies a lo ancho de hombros. Baja como si te sentaras en una silla, rodillas siguiendo la punta del pie. Espalda recta. Sube apretando glúteos.",
       tip:"La banda sobre las rodillas activa los glúteos medios — clave para tu pelvis."},
      {id:"pushup",name:"Push-up",muscles:"Pecho · Hombros · Tríceps",work:40,rest:20,
       ytId:"WDIpL0pjun0",ytTitle:"Push-up — NASM Tutorial",
       cue:"Manos a lo ancho de hombros. Cuerpo en línea recta de cabeza a talones. Baja el pecho. Modifica apoyando rodillas si es necesario.",
       tip:"Mete el mentón ligeramente al bajar — protege tu cervical."},
      {id:"shoulder-press",name:"Shoulder Press",muscles:"Hombros · Tríceps · Core",work:40,rest:20,
       ytId:"qLZU6Fl2sI4",ytTitle:"Standing DB Shoulder Press",
       cue:"De pie, mancuernas a los hombros. Empuja hacia arriba extendiendo los brazos. Baja en 2-3 segundos con control.",
       tip:"Activa el core antes de cada rep — evita arquear la espalda baja."},
      {id:"reverse-lunge",name:"Reverse Lunge",muscles:"Piernas · Glúteos · Equilibrio",work:40,rest:20,
       ytId:"3rzFW6b9nxQ",ytTitle:"Reverse Lunge Tutorial",
       cue:"Paso grande hacia atrás. Rodilla trasera baja sin tocar el suelo. Regresa empujando con el talón delantero. Alterna lados.",
       tip:"El lunge hacia atrás protege la rodilla más que el frontal — ideal para tu diagnóstico."},
    ]
  },
  {
    id:"B",name:"Día B",label:"Jale + Glúteo",color:"#22C55E",bg:"rgba(34,197,94,.12)",kcal:170,
    exercises:[
      {id:"band-row",name:"Band Row",muscles:"Espalda · Bíceps · Postura",work:40,rest:20,
       ytId:"Hh4eimGQFFs",ytTitle:"Resistance Band Row Tutorial",
       cue:"Banda anclada al frente. Jala los codos hacia atrás juntando los omóplatos. Pecho arriba.",
       tip:"Concéntrate en juntar los omóplatos — refuerza lo que el Dr. Bruno está corrigiendo."},
      {id:"rdl",name:"RDL con mancuerna",muscles:"Isquiotibiales · Glúteos · Espalda baja",work:40,rest:20,
       ytId:"hCDzSR6Dgm0",ytTitle:"Romanian Deadlift — Perfect Form",
       cue:"Empuja las caderas hacia atrás con rodillas ligeramente flexionadas. Baja hasta sentir tensión en los isquiotibiales. Regresa apretando glúteos.",
       tip:"NUNCA redondees la espalda baja — el ejercicio más importante para tu L4-L5."},
      {id:"band-pull-apart",name:"Band Pull Apart",muscles:"Omóplatos · Manguito rotador",work:40,rest:20,
       ytId:"P8-N0uxJHqQ",ytTitle:"Band Pull Apart Tutorial",
       cue:"Banda horizontal al frente. Abre los brazos estirando la banda hasta tocar el pecho. Junta omóplatos al máximo.",
       tip:"Complementa tu rutina de HealthSource — refuerza lo que el Dr. Bruno ajusta."},
      {id:"hip-thrust",name:"Hip Thrust con banda",muscles:"Glúteos · Core · Pelvis",work:40,rest:20,
       ytId:"LM8XfHPOI4o",ytTitle:"Hip Thrust Tutorial",
       cue:"Espalda en el sofá, rodillas dobladas, pies planos. Empuja caderas al techo apretando glúteos. Mantén 1 segundo arriba.",
       tip:"El ejercicio más efectivo para glúteos — estabiliza tu pelvis y protege L4-L5."},
    ]
  },
  {
    id:"C",name:"Día C",label:"Cuerpo completo",color:"#FF6B35",bg:"rgba(255,107,53,.12)",kcal:200,
    exercises:[
      {id:"goblet-squat",name:"Goblet Squat",muscles:"Piernas · Core · Movilidad",work:40,rest:20,
       ytId:"7-80HiXX1K8",ytTitle:"Goblet Squat Tutorial",
       cue:"Mancuerna vertical al pecho. Pies algo más abiertos. Baja profundo manteniendo el pecho arriba. Codos empujan rodillas hacia afuera.",
       tip:"La mancuerna al pecho fuerza la espalda recta — versión más segura de squat para tu columna."},
      {id:"dead-bug",name:"Dead Bug",muscles:"Core profundo · Lumbar",work:40,rest:20,
       ytId:"4XLEnwUr1d8",ytTitle:"Dead Bug — Core Exercise",
       cue:"Boca arriba, brazos al techo, rodillas a 90°. Baja LENTO brazo derecho y pierna izquierda simultáneamente. La espalda baja nunca despega del suelo.",
       tip:"El mejor ejercicio de core para tu diagnóstico — activa profundo sin presión discal."},
      {id:"mountain-climber",name:"Mountain Climber",muscles:"Core · Cardio · Hombros",work:40,rest:20,
       ytId:"nmwgirgXLYM",ytTitle:"Mountain Climbers — Proper Form",
       cue:"Plancha alta. Lleva una rodilla al pecho alternando rápido como si corrieras. Caderas bajas. Core apretado.",
       tip:"Mayor quema calórica de la sesión — mantén el ritmo rápido los 40 segundos."},
      {id:"thruster",name:"Thruster",muscles:"Cuerpo completo · Quema máxima",work:40,rest:20,
       ytId:"hyLF1hSfQpo",ytTitle:"Goblet Squat + Thruster Tutorial",
       cue:"Mancuernas a los hombros. Baja en squat. Al subir usa el impulso para presionar las mancuernas sobre la cabeza en un movimiento fluido.",
       tip:"Squat + Press en un solo rep — máxima quema en mínimo tiempo."},
    ]
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let hist={};
try{hist=JSON.parse(localStorage.getItem("force_v4")||"{}");}catch{}
let dayId=null,round=1,exIdx=0,phase="work",remaining=0,running=false,iv=null,doneIds=[];
const ROUNDS=3;

// ─── AUDIO ────────────────────────────────────────────────────────────────────
let ac=null;
function beep(f=660,d=0.18){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.connect(g);g.connect(ac.destination);o.frequency.value=f;
    g.gain.setValueAtTime(0,ac.currentTime);
    g.gain.linearRampToValueAtTime(0.3,ac.currentTime+0.01);
    g.gain.linearRampToValueAtTime(0,ac.currentTime+d);
    o.start();o.stop(ac.currentTime+d);
  }catch{}
}

// ─── RING SVG ─────────────────────────────────────────────────────────────────
function ring(total,rem,isRest,sz=150){
  const r=sz/2-10,c=2*Math.PI*r,pct=total>0?rem/total:0;
  const col=isRest?"#2D3A6B":"#FF6B35",tcol=isRest?"#6B7698":"#FFB347";
  const s=rem<10?"0"+rem:""+rem;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}">
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="#252D40" stroke-width="9"/>
    <circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke="${col}" stroke-width="9"
      stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-pct)).toFixed(1)}"
      transform="rotate(-90 ${sz/2} ${sz/2})" style="transition:stroke-dashoffset .15s linear"/>
    <text x="50%" y="44%" text-anchor="middle" dominant-baseline="middle"
      font-size="${Math.round(sz*.3)}" font-weight="800" fill="#F1F5FF" font-family="monospace">${s}</text>
    <text x="50%" y="70%" text-anchor="middle" dominant-baseline="middle"
      font-size="${Math.round(sz*.1)}" font-weight="700" fill="${tcol}" font-family="-apple-system,sans-serif">
      ${isRest?"DESCANSO":"TRABAJA"}</text>
  </svg>`;
}

// ─── YOUTUBE EMBED ────────────────────────────────────────────────────────────
// Tap-to-load: shows thumbnail first, loads iframe on tap (saves bandwidth + avoids autoplay issues)
function ytEmbed(ytId, title){
  const thumb=`https://img.youtube.com/vi/${ytId}/mqdefault.jpg`;
  return `
    <div class="yt-wrap" id="yt-${ytId}">
      <img src="${thumb}" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;"/>
      <div class="yt-tap" onclick="loadYT('${ytId}')">
        <div class="yt-play">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <div class="yt-title">${title}</div>
      </div>
    </div>`;
}

function loadYT(id){
  const wrap=document.getElementById("yt-"+id);
  if(!wrap)return;
  wrap.innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1" 
    allow="autoplay; fullscreen" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe>`;
}

// ─── HOME ─────────────────────────────────────────────────────────────────────
function renderHome(){
  const entries=Object.entries(hist).sort((a,b)=>b[0].localeCompare(a[0]));
  const week=entries.filter(([d])=>(Date.now()-new Date(d))/86400000<7);
  document.getElementById("sw").textContent=week.length;
  document.getElementById("st").textContent=entries.length;
  document.getElementById("sm").textContent=entries.length*20;
  const dl=document.getElementById("dlist");
  dl.innerHTML="";
  DAYS.forEach(day=>{
    const last=entries.find(([,id])=>id===day.id);
    const lastTxt=last?last[0].slice(5).replace("-","/ "):"";
    const div=document.createElement("div");
    div.className="dcard";
    div.innerHTML=`
      <button class="dbtn" onclick="togglePrev('${day.id}')">
        <div class="dicon" style="background:${day.bg};border-color:${day.color};color:${day.color}">${day.id}</div>
        <div style="flex:1">
          <div class="dname">${day.name}</div>
          <div class="dsub">${day.label}</div>
        </div>
        <div class="dright">
          ${lastTxt?`<div class="dlast">Último: ${lastTxt}</div>`:""}
          <div class="dcnt" style="color:${day.color}">${day.exercises.length} ej · 3 rondas</div>
        </div>
        <span class="chv" id="chv-${day.id}">⌄</span>
      </button>
      <div class="ppanel" id="pp-${day.id}">
        ${day.exercises.map((ex,i)=>`
          <div class="prow">
            <div class="pnum">${i+1}</div>
            <div style="flex:1">
              <span class="pname">${ex.name}</span><br>
              <span class="pmus">${ex.muscles}</span>
            </div>
            <span class="ptime">${ex.work}s</span>
          </div>`).join("")}
        <button class="sbtn" style="background:${day.color}" onclick="startSession('${day.id}')">
          Comenzar ${day.name} →
        </button>
      </div>`;
    dl.appendChild(div);
  });
  const hs=document.getElementById("hsec"),hl=document.getElementById("hlist");
  if(entries.length>0){
    hs.style.display="block";
    hl.innerHTML=entries.slice(0,7).map(([date,id])=>{
      const d=DAYS.find(x=>x.id===id);
      return `<div class="hrow">
        <div class="hdot" style="background:${d?.color||"#FF6B35"}"></div>
        <div class="hname">${d?.name} — ${d?.label}</div>
        <div class="hdate">${date.slice(5).replace("-","/")}</div>
      </div>`;
    }).join("");
  } else hs.style.display="none";
}

function togglePrev(id){
  DAYS.forEach(d=>{
    if(d.id!==id){document.getElementById("pp-"+d.id)?.classList.remove("open");document.getElementById("chv-"+d.id)?.classList.remove("open");}
  });
  document.getElementById("pp-"+id)?.classList.toggle("open");
  document.getElementById("chv-"+id)?.classList.toggle("open");
}

// ─── SESSION ──────────────────────────────────────────────────────────────────
function startSession(id){
  dayId=id;round=1;exIdx=0;phase="work";doneIds=[];running=false;clearInterval(iv);
  remaining=DAYS.find(d=>d.id===id).exercises[0].work;
  show("sess-screen");renderSess();
}

function renderSess(){
  const day=DAYS.find(d=>d.id===dayId),exs=day.exercises,ex=exs[exIdx];
  document.getElementById("sround").textContent=`Ronda ${round} de ${ROUNDS}`;
  document.getElementById("stitle").textContent=`${day.name} — ${day.label}`;
  document.getElementById("sdots").innerHTML=exs.map((_,i)=>
    `<div class="pd ${i<exIdx?"pdn":i===exIdx?"pac":""}"></div>`).join("");
  if(phase==="roundrest"){
    document.getElementById("selbl").textContent="Descansa entre rondas";
    document.getElementById("settl").textContent=`Ronda ${round+1} de ${ROUNDS} en breve`;
    document.getElementById("scue").textContent="Respira, hidratate, prepárate.";
  } else {
    document.getElementById("selbl").textContent=`Ejercicio ${exIdx+1} de ${exs.length}`;
    document.getElementById("settl").textContent=ex.name;
    document.getElementById("scue").textContent=phase==="rest"?"Prepárate para el siguiente →":ex.cue;
  }
  const isRest=phase!=="work";
  const total=phase==="work"?ex.work:phase==="rest"?ex.rest:60;
  document.getElementById("ringwrap").innerHTML=ring(total,remaining,isRest,150);
  const btn=document.getElementById("sabtn");
  btn.textContent=running?"Pausar":"Iniciar";
  btn.style.background=running?"var(--border)":"var(--accent)";
  btn.style.color="#fff";
  renderCards(exs);
}

function renderCards(exs){
  document.getElementById("scards").innerHTML=exs.map((ex,i)=>{
    const active=i===exIdx&&phase==="work",done=doneIds.includes(ex.id);
    return `<div class="ecard ${active?"iac":""} ${done?"idn":""}" id="ec-${ex.id}">
      <button class="ecbtn" onclick="toggleCard('${ex.id}')">
        <div class="enum ${active?"nac":""} ${done?"ndn":""}">${done?"✓":i+1}</div>
        <div style="flex:1;min-width:0">
          <div class="ettl">${ex.name}</div>
          <div class="emus">${ex.muscles}</div>
        </div>
        <div class="etm">${ex.work}s·${ex.rest}s</div>
        <div class="echv" id="ech-${ex.id}">⌄</div>
      </button>
      <div class="ebody" id="eb-${ex.id}">
        ${ytEmbed(ex.ytId, ex.ytTitle)}
        <p class="ecue">${ex.cue}</p>
        <div class="etip">💡 ${ex.tip}</div>
      </div>
    </div>`;
  }).join("");
}

function toggleCard(id){
  const b=document.getElementById("eb-"+id),c=document.getElementById("ech-"+id);
  const o=b.classList.toggle("open");c.style.transform=o?"rotate(180deg)":"none";
}

function toggleTimer(){ if(running)pauseTimer(); else startTimer(); }

function startTimer(){
  running=true;renderSess();
  const day=DAYS.find(d=>d.id===dayId);
  iv=setInterval(()=>{
    remaining--;
    const ex=day.exercises[exIdx];
    const isRest=phase!=="work";
    const total=phase==="work"?ex.work:phase==="rest"?ex.rest:60;
    document.getElementById("ringwrap").innerHTML=ring(total,remaining,isRest,150);
    if(remaining<=0){clearInterval(iv);advance();}
  },1000);
}

function pauseTimer(){
  running=false;clearInterval(iv);
  const b=document.getElementById("sabtn");b.textContent="Iniciar";b.style.background="var(--accent)";
}

function advance(){
  const day=DAYS.find(d=>d.id===dayId),exs=day.exercises;
  if(phase==="work"){
    beep(440,.12);
    if(exIdx<exs.length-1){phase="rest";remaining=exs[exIdx].rest;}
    else if(round<ROUNDS){phase="roundrest";remaining=60;}
    else{showDone();return;}
  } else if(phase==="rest"){
    beep(660,.1);doneIds.push(exs[exIdx].id);
    exIdx++;phase="work";remaining=exs[exIdx].work;
  } else {
    beep(880,.2);round++;exIdx=0;phase="work";remaining=exs[0].work;doneIds=[];
  }
  running=true;renderSess();startTimer();
}

function showDone(){
  running=false;
  const day=DAYS.find(d=>d.id===dayId);
  document.getElementById("dsub").textContent=`${day.name} · ${ROUNDS} rondas`;
  document.getElementById("dser").textContent=day.exercises.length*ROUNDS;
  document.getElementById("dkcal").textContent=`~${day.kcal}`;
  show("done-screen");
}

function finishSession(){
  const today=new Date().toISOString().split("T")[0];
  hist[today]=dayId;
  try{localStorage.setItem("force_v4",JSON.stringify(hist));}catch{}
  goHome();
}

function goHome(){running=false;clearInterval(iv);show("home-screen");renderHome();}

function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

renderHome();
</script>
